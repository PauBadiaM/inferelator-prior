# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Inferelator-Prior CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        python-version: ${{ matrix.python-version }}
    - name: Conda Config
      shell: bash -l {0}
      run: |
        conda config --add channels bioconda
        conda install -c bioconda meme samtools sra-tools star homer htslib bedtools
        conda info
        conda list
        conda env list
    - name: Install dependencies
      shell: bash -l {0}
      run: |
        python -m pip install --upgrade pip wheel
        python -m pip install Cython --install-option="--no-cython-compile"
        python -m pip install coverage pytest
        python -m pip install numpy matplotlib pysam
        python -m pip install -r requirements.txt
    - name: Test with pytest & coverage
      shell: bash -l {0}
      run: |
        python -m coverage run -m pytest
        python -m coverage xml
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4